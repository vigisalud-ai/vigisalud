name: VigiSalud Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # 06:00 AM Argentina (UTC-3)

jobs:
  predecir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests numpy scikit-learn pandas python-dotenv openai

      - id: modelo
        run: python prediccion/controller/modelo_v3_5.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - run: python parte_clinico_nvidia.py
        continue-on-error: true
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Notificar éxito por Telegram
        if: steps.modelo.outcome == 'success'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.CHAT_ID }}" \
          -d text="✅ VigiSalud ejecutado correctamente. Revisá las alertas."

      - name: Notificar fallo por Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.CHAT_ID }}" \
          -d text="⚠️ VigiSalud: El pipeline falló hoy. Revisando..."
